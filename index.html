<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
  <title>Not Not</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <canvas id="bg"></canvas>

  <!-- ── HUD (always on top during game) ── -->
  <div id="hud" class="hidden">
    <div id="lives-row">
      <span id="h1" class="heart">♥</span>
      <span id="h2" class="heart">♥</span>
      <span id="h3" class="heart">♥</span>
    </div>
    <div id="score-display">0</div>
  </div>

  <!-- ── Instruction overlay (projected onto cube top) ── -->
  <div id="instruction" class="hidden">
    <div id="nots-row"></div>
    <div id="dir-word"></div>
  </div>

  <!-- ── Feedback flash ── -->
  <div id="flash"></div>

  <!-- ── Start Screen ── -->
  <div id="screen-start" class="screen active">
    <div class="logo-wrap">
      <div class="logo-not">NOT</div>
      <div class="logo-not">NOT</div>
    </div>
    <p class="tagline">SWIPE THE RIGHT WAY</p>
    <button id="btn-play" class="cta">TAP TO PLAY</button>
    <p class="hint-text">← Swipe to move the character →<br>Resolve all NOT prefixes first</p>
  </div>

  <!-- ── Game Over Screen ── -->
  <div id="screen-over" class="screen">
    <p class="over-label">GAME OVER</p>
    <div class="score-block">
      <span class="sb-label">SCORE</span>
      <span id="over-score" class="sb-num">0</span>
    </div>
    <div class="score-block">
      <span class="sb-label">BEST</span>
      <span id="over-best" class="sb-num gold">0</span>
    </div>
    <button id="btn-retry" class="cta">PLAY AGAIN</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
